[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpanel"
version = "1.0.0"
description = "Self-hosted TUI manager for Minecraft modpack servers"
requires-python = ">=3.9"
dependencies = [
    "textual>=1.0",
    "requests>=2.25",
]

[project.scripts]
mcpanel = "mcpanel.cli:main"

[tool.setuptools]
packages = ["mcpanel"]
